# Job Search Workflow — Career Pages Directory
#
# Structured, machine-readable registry of company career pages.
# Each entry includes: name, careers_url, ats_provider, location_policy,
# industry, company_size, last_verified.
#
# Community PRs welcome — see data/career-pages/README.md for guidelines.
#
# ats_provider values: greenhouse | lever | ashby | workday | rippling |
#   workable | personio | greenhouse_io | custom | unknown
# location_policy values: remote | hybrid | onsite | mixed
# company_size values: startup | small | medium | large | enterprise
#
# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0

